<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CompTIA Security+ 考題練習</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title-block">
        <h1>CompTIA Security+ 考題練習</h1>
        <p class="subtitle">依版本與領域複習，從選項解析理解安全決策。</p>
      </div>
      <div class="status-pills" aria-live="polite">
        <span class="pill" id="bankStatus">題庫載入中</span>
        <span class="pill" id="sessionStatus">尚未開始</span>
      </div>
    </header>
    <div class="layout">
      <details class="panel setup" id="settingsPanel" open>
        <summary class="settings-summary">
          <span>練習設定</span><span class="summary-meta" id="settingsSummaryText">載入題庫中</span>
        </summary>
        <form class="settings-body" id="settingsForm">
          <div class="field">
            <label for="versionSelect">考試版本</label>
            <select id="versionSelect" disabled>
              <option value="SY0-701">SY0-701</option>
              <option value="SY0-801">SY0-801</option>
            </select>
          </div>
          <div class="field">
            <label for="categorySelect">領域</label>
            <select id="categorySelect" disabled><option value="all">全部</option></select>
          </div>
          <div class="field">
            <label for="limitSelect">題數</label>
            <select id="limitSelect" disabled>
              <option value="10">10 題練習</option>
              <option value="25">25 題練習</option>
              <option value="90">90 題練習</option>
              <option value="all">全部</option>
            </select>
          </div>
          <div class="field">
            <span class="field-label">排序方式</span>
            <label class="toggle-row" for="shuffleInput"><span>隨機排序</span><input id="shuffleInput" type="checkbox" checked disabled></label>
          </div>
          <p class="rule-note" id="ruleText">原創練習題，非 CompTIA 官方試題。練習答對率不等同正式考試量尺分數。</p>
          <div class="actions"><button class="btn full" id="startButton" disabled>開始練習</button></div>
        </form>
      </details>
      <section class="quiz-shell">
        <div class="panel loading" id="loadingView">正在讀取題庫</div>
        <div class="panel error hidden" id="errorView" role="alert"></div>
        <section class="panel quiz hidden" id="quizView">
          <div class="quiz-head">
            <div class="meta"><span class="tag version-tag" id="versionTag"></span><span class="tag" id="objectiveTag"></span><span class="tag" id="typeTag"></span></div>
            <div class="progress-text" id="progressText"></div>
          </div>
          <div class="progress-bar" role="progressbar" aria-label="答題進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
          <p class="domain-label" id="domainText"></p>
          <div class="case-box hidden" id="caseBox"><p class="case-title" id="caseTitle"></p><p id="caseDescription"></p></div>
          <article class="question"><h2 id="questionText" tabindex="-1"></h2></article>
          <p class="selection-hint" id="selectionHint"></p>
          <div class="options" id="optionsList" role="group" aria-labelledby="questionText"></div>
          <div class="quiz-actions"><button class="btn" id="checkButton" disabled>確認答案</button><button class="btn secondary hidden" id="nextButton">下一題</button></div>
          <div class="feedback hidden" id="feedbackBox" aria-live="polite">
            <p class="feedback-title" id="feedbackTitle"></p><p id="feedbackText"></p>
            <ul class="option-reasons" id="optionReasons"></ul>
            <details class="references"><summary>參考資料</summary><ul id="referenceList"></ul></details>
          </div>
        </section>
        <section class="panel result hidden" id="resultView">
          <h2 tabindex="-1" id="resultTitle">練習結果</h2><p class="subtitle" id="resultSummary"></p>
          <div class="score-grid">
            <div class="score-card"><div class="score-value" id="scoreValue">0 / 0</div><div class="score-label">答對題數</div></div>
            <div class="score-card"><div class="score-value" id="rateValue">0%</div><div class="score-label">練習答對率</div></div>
            <div class="score-card"><div class="score-value" id="wrongValue">0</div><div class="score-label">錯題數</div></div>
          </div>
          <p class="score-note">本練習每題等權重，複選須完全答對；不換算 CompTIA 的 100–900 量尺分數。</p>
          <div class="actions"><button class="btn" id="restartButton">再練一次</button><button class="btn secondary" id="retryWrongButton">只練錯題</button><button class="btn secondary" id="changeButton">更換設定</button></div>
          <div class="review-list" id="reviewList"></div>
        </section>
      </section>
    </div>
    <footer class="app-footer">原創選擇題與情境題練習。<a href="docs/security-plus-research.md">資料來源與版本研究</a></footer>
  </main>
  <script type="module" src="scripts/app.js"></script>
</body>
</html>
